[project]
name = "slicer-cli"
version = "0.1.0"
description = "Depth aware cli scene slicing tool."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
    "shapely>=2.1.2",
    "typer>=0.26.7",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]